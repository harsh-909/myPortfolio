<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
    <rect x="10" y="10" width="80" height="40" fill="#4CAF50" stroke="#000" stroke-width="2" />
    <text x="50" y="35" font-size="12" text-anchor="middle" fill="#fff">Code</text>

    <line x1="90" y1="30" x2="110" y2="30" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="110" y="10" width="80" height="40" fill="#2196F3" stroke="#000" stroke-width="2" />
    <text x="150" y="35" font-size="12" text-anchor="middle" fill="#fff">Build</text>

    <line x1="190" y1="30" x2="210" y2="30" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="210" y="10" width="80" height="40" fill="#FFC107" stroke="#000" stroke-width="2" />
    <text x="250" y="35" font-size="12" text-anchor="middle" fill="#000">Test</text>

    <line x1="290" y1="30" x2="310" y2="30" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="310" y="10" width="80" height="40" fill="#F44336" stroke="#000" stroke-width="2" />
    <text x="350" y="35" font-size="12" text-anchor="middle" fill="#fff">Deploy</text>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
        </marker>
    </defs>
</svg>